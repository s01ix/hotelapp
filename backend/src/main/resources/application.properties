spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:zzzz}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:zzzz}
spring.security.oauth2.client.registration.google.scope=profile,email

# Klucze PayPal (sandbox) - podawane przez zmienne srodowiskowe, nie trzymamy ich w repozytorium
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}

# strona: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
